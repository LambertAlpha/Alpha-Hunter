[project]
name = "alpha-hunter"
version = "0.2.0"
description = "Auditable monthly cross-sectional prediction experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "scipy>=1.11",
    "torch>=2.6", "matplotlib>=3.8", "seaborn>=0.13", "tqdm>=4.66",
]

[dependency-groups]
dev = ["ruff>=0.12", "pyright>=1.1.400"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
# Active training path and tests; historical notebooks/research scripts are archived.
include = ["src/data_loader.py", "src/evaluator.py", "src/trainer.py", "src/config.py", "src/cli.py", "src/models.py", "src/models_tfa.py", "src/nn_utils.py", "src/tfa_analysis.py", "src/plot_tfa_attention.py", "train.py", "train_tfa.py", "train_tfa_multiple.py", "tests/*.py", "scripts/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src/data_loader.py", "src/evaluator.py", "src/trainer.py", "src/config.py", "src/cli.py", "src/models.py", "src/models_tfa.py", "src/nn_utils.py", "src/tfa_analysis.py", "src/plot_tfa_attention.py", "train.py", "train_tfa.py", "train_tfa_multiple.py", "scripts/*.py"]
typeCheckingMode = "basic"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
